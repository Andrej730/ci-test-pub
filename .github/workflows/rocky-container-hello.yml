name: rocky container hello

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container.image }}
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            container:
              image: rockylinux:9@sha256:03303863808e9cd79f0c58c833db3e5f9cde9f2abe16804a267b05dc54af86e4
    steps:
      - name: Print PATH
        run: |
          echo "$PATH" | tr ':' '\n'
          command -v tar

      - name: Add a directory to PATH
        run: echo "/opt/dummy/bin" >> "$GITHUB_PATH"

      - name: Print PATH after uv
        run: |
          echo "$PATH" | tr ':' '\n'
          command -v tar || echo "tar NOT FOUND"

      - uses: actions/checkout@v5

      - name: Run hello script
        run: sh scripts/hello.sh
