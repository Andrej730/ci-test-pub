name: rocky container hello

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            container:
              image: rockylinux:9
    steps:
      - name: Print PATH
        run: |
          echo "$PATH" | tr ':' '\n'
          command -v tar

      - name: Add a directory to PATH
        run: echo "/opt/dummy/bin" >> "$GITHUB_PATH"

      - name: Print PATH after uv
        run: |
          echo "$PATH" | tr ':' '\n'
          command -v tar || echo "tar NOT FOUND"

      - uses: actions/checkout@v5

      - name: Run hello script
        run: sh scripts/hello.sh
